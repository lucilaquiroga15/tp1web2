spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com


# Conexion a PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tp2_web2}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}


# Configuracion JWT (en producción se pisa con variables de entorno)
app.jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-produccion-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}



# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


#temporalmente 
server.error.include-message=always
server.error.include-exception=true
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter=DEBUG